name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4

      - name: Validate ai-rulez config
        run: npx ai-rulez@3.6.1 validate

      - name: Install Bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats

      - name: Test R2 cache action
        run: bats .github/actions/r2-cache/tests/cache-v2.bats
